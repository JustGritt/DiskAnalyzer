[package]
name = "diskanalyzer"
version = "2.0.0"
edition = "2021"
description = "Read-only inventory of what is using space on a drive"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
blake3 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # CreateFileW's signature names SECURITY_ATTRIBUTES; only null is passed.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Time",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
