name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy (includes the read-only disallowed-methods lint)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (includes the read-only source audit)
        run: cargo test
