name: Release

# Pushing a tag such as v2.1.0 builds one binary per platform and attaches
# them to a GitHub release for that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

  build:
    needs: create
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static CRT, so the .exe needs no Visual C++ runtime installed.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            rustflags: -C target-feature=+crt-static
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # musl links statically, so the binary does not depend on the
          # runner's glibc version.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Attach to the release
        shell: bash
        run: |
          asset="diskanalyzer-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/diskanalyzer${{ matrix.ext }}" "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset"
